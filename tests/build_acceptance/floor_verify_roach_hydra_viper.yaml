strategy_id: macro_hatch   # 起步 opening（zerg 经济框架）
my_race: Zerg

# WorkerSaturationFloorAct 真局验证专用 spec（2026-07-10，不是常规 build_acceptance
# 门禁）——macro_hatch 开局 opening_completed 后 auto-switch 到
# persistent_roach_hydra_viper（结构冻结病 build 之一），走真实"opening → 玩家切
# doctrine（PWA toast confirm）"路径：director.py:7277 一旦 board.slots[MIDGAME/
# LATEGAME] 非空（auto_switch 走的就是这条），OpeningSustainAct 的
# sustain_uncap_active flag 永不 set → 整局零农民兜底（除非有 Floor）。用来验证
# Floor 恒生效、不依赖该 flag，doctrine 期间农民仍能爬向 ideal_harvesters（受
# ZERG_WORKER_CAP=66 封顶）。
#
# run: .venv/Scripts/python.exe scripts/build_acceptance.py floor_verify_roach_hydra_viper --opponent veryeasy

auto_switch_to: persistent_roach_hydra_viper
auto_switch_delay_s: 10.0

checks:
  - id: worker_sanity_early
    type: unit_count
    unit: DRONE
    at: "3:00"
    tol: 60
    min: 10
    # 早期 macro_hatch 经济健康基线（宽松，仅防止彻底断供）

economy_profile:
  - at: "3:00"
    workers: 20
    minerals: 200

  - at: "8:00"
    workers: 40
    minerals: 300
