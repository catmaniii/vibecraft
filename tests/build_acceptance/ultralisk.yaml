strategy_id: ultralisk
my_race: Zerg

# 2026-07-10 结构冻结修复验收(worker-saturation-floor 设计文档 4 结构病之一)。
# 修复前:小狗/毒爆/雷兽全塞进 SequentialList 最后一个内嵌 BuildOrder,要等
# VU(雷兽洞,整条 Hive 科技链末端)建好才出第一个地面单位——前中期零地面兵。
# 修复后:外层 SequentialList 改 BuildOrder(并行),硬前置(Pool→MorphLair/
# Pool→BB/Lair→VI/VI→MorphHive/Hive→VU)继续用 Step(UnitReady(...)) 门控,
# 但小狗（Pool 门控）/毒爆（BB 门控）不再被 Hive 链阻塞，能早出。
#
# 本 spec 核心目的:证明前中期（Hive/VU 完成前）已有小狗/毒爆等地面兵。
# run: .venv/Scripts/python.exe scripts/build_acceptance.py ultralisk --opponent veryeasy

checks:
  - id: spawning_pool
    type: building_complete
    unit: SPAWNINGPOOL
    at: "1:20"
    tol: 60
    # 实测并行化后 Pool 约 1:11 完成，窗口 0:20-2:20

  - id: baneling_nest
    type: building_complete
    unit: BANELINGNEST
    at: "3:00"
    tol: 60
    # Step(UnitReady(SPAWNINGPOOL,1), GridBuilding(BANELINGNEST,1))：Pool 完成
    # 后立刻触发（并行，不再等 Expand(5)/BV/Hive 链）

  - id: zergling_early
    type: unit_count
    unit: ZERGLING
    at: "4:00"
    tol: 90
    min: 1
    # 核心回归断言:老 bug 下地面兵要等 VU（整条 Hive 链）完成才出，冷启动下
    # VU 常在 9-11 分钟之后。这里断言 4:00 前已有 ≥1 小狗（Step 只门控在
    # SPAWNINGPOOL），证明不再被 Hive 链冻结。

  - id: baneling_early
    type: unit_count
    unit: BANELING
    at: "6:00"
    tol: 120
    min: 1
    # 同上逻辑：毒爆只门控在 BANELINGNEST ready，不再等 Hive/VU

  - id: attack_moveout
    type: attack_moveout
    by: "14:00"
    # 雷兽流是深后期 doctrine，冷启动出门较晚，宽松兜底

# 经济曲线标准值（宽松，仅防止彻底断供）
economy_profile:
  - at: "4:00"
    workers: 26
    minerals: 300

  - at: "8:00"
    workers: 40
    minerals: 400
