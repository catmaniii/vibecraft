strategy_id: phoenix_2base
my_race: Protoss
# research 来源:
#   - https://lotv.spawningtool.com/build/126982/
#     (HuShang Double Stargate Phoenix PvZ: 本项目 plan docstring 主参考来源;
#      Pylon@0:18/14, Gateway@0:38/15, Assimilator@0:47/16,
#      Nexus expand@1:24/19, CyberneticsCore@1:34/20, Assimilator#2@1:43/21,
#      Stargate#1@2:19/26, WGR@2:28/27,
#      Phoenix#1@3:31/43, Stargate#2@3:59/51,
#      4x Phoenix@4:35, 6x Phoenix@4:58, 8x Phoenix@5:23,
#      Robo@5:30, 3rd Nexus@7:37)
#   - https://lotv.spawningtool.com/build/149968/
#     (Trap's Cyber First Phoenix/Colossus PvT: CyberneticsCore@1:24,
#      Nexus@1:34, Stargate@2:31, WGR@2:34,
#      Phoenix#1@3:15, Phoenix#5@4:43, Robo@4:14, Nexus#3@4:59)
#   - https://liquipedia.net/starcraft2/Phoenix_(Legacy_of_the_Void)
#     (Phoenix unit stats: 150/100, 25s build time, supply 2;
#      standard usage: 4+ Phoenix before committing to harass)
#   - https://lotv.spawningtool.com/build/93646/
#     (Safe & Macro Stargate Opening PvZ: Nexus+Core@~1:24,
#      Stargate@2:24, WGR@2:37, Phoenix#1@3:38; slower variant)
#
# 本项目 plan 说明:
#   phoenix_2base.py 主线基于 spawningtool 126982 (HuShang Double Stargate PvZ)。
#   plan 中第 2 VS 在 4 只凤凰出来后建 (UnitExists PHOENIX 4 触发)，
#   与参考来源 126982 的 3:59 第 2 VS 时序一致。
#   8 凤凰出门骚扰对应参考来源 5:23 凤凰集结完成。

checks:
  # --- 开局基础 ---
  - id: pylon_1
    type: building_started
    unit: PYLON
    by: "0:35"
    # supply 14 下水晶；参考 126982: 0:18, 149968: 0:18
    # plan: 14 探机→PYLON，约 0:20-0:30 开始建

  - id: gateway_1
    type: building_complete
    unit: GATEWAY
    at: "1:20"
    tol: 20
    # supply 15 开建；参考 126982: 0:38 开建(65s 建造)→完成约 1:40
    # 参考 149968: 0:36 开建→完成约 1:40；plan SequentialList 顺序执行，约 1:20-1:40

  - id: assimilator_1
    type: building_complete
    unit: ASSIMILATOR
    by: "1:45"
    # supply 16 建第 1 气矿；参考 126982: 0:47 开建(30s)→完成约 1:17
    # plan: BuildGas(1) 在 BG 后，略晚；给 by 1:45 容错

  - id: nexus_2
    type: building_complete
    unit: NEXUS
    at: "2:55"
    tol: 25
    # 二矿扩张；参考 126982: 1:24 开建(71s)→完成约 2:35。
    # plan: BG ready 后触发 Expand(2)，NX 完成实测 ~174s。
    # 2026-05-20 校准：原 at 1:55±20 算错（注释自称"覆盖至 2:55"，但
    # 1:55±20 实际只到 2:15）。校准到 2:55±25 覆盖实测 + research。

  - id: assimilator_2
    type: building_complete
    unit: ASSIMILATOR
    by: "2:30"
    # 第 2 气矿（双矿各 1 气）；参考 126982: 1:43 开建(30s)→完成约 2:13
    # plan: UnitExists(NEXUS,2) → BuildGas(2)；二矿落地后立即建

  - id: cyber_core
    type: building_complete
    unit: CYBERNETICSCORE
    at: "2:40"
    tol: 25
    # 参考 126982: 1:34 开建(50s)→完成约 2:24。
    # plan: BG ready 后触发 Core，实测完成 ~157-166s（边界抖动）。
    # 2026-05-20 校准：原 at 2:25±20 上界 2:45 卡边界，放宽到 2:40±25。

  # warpgate_research check 已移除 —— 2026-05-27 task #356 用户决策：
  # 两矿凤凰跳过折跃研究，优先凤凰产能。plan 不再发出 Tech(WARPGATERESEARCH)。

  - id: assimilator_3
    type: building_complete
    unit: ASSIMILATOR
    by: "2:50"
    # 第 3 气矿（双矿补二气）；参考 126982: 1:43 同步建 2 个 Assimilator
    # plan: UnitExists(NEXUS,2) → BuildGas(3)；约 2:15-2:30 建完

  - id: stargate_1
    type: building_complete
    unit: STARGATE
    at: "3:20"
    tol: 20
    # 第 1 星门；参考 126982: 2:19 开建(50s)→完成约 3:09
    # 参考 149968: 2:31 开建→完成约 3:21；plan Core ready 后建 Stargate
    # Core 完成约 2:15-2:25→VS 开建约 2:20-2:30→完成约 3:10-3:20

  - id: phoenix_first
    type: unit_count
    unit: PHOENIX
    at: "3:45"
    tol: 20
    # 第 1 只凤凰产出；参考 126982: 3:31; 149968: 3:15; 93646: 3:38
    # 标准中位约 3:30-3:40；plan VS ready 后立刻 chrono 凤凰
    # 给 at 3:45 ±20s 覆盖 3:25-4:05

  - id: stargate_2
    type: building_count
    unit: STARGATE
    at: "4:30"
    tol: 30
    min: 2
    # 第 2 星门；参考 126982: 3:59 建第 2 VS；参考 149968 无第 2 VS（单 VS 变体）
    # plan: UnitExists(PHOENIX,4) 触发→第 4 只凤凰出来约 4:15-4:35 → VS 完成约 5:05-5:25
    # 此 check 验 2 个 VS 均存在（building_count），给宽松窗口

  - id: phoenix_four
    type: unit_count
    unit: PHOENIX
    at: "4:35"
    tol: 30
    min: 4
    # 4 只凤凰集结（最小骚扰数量；Liquipedia 标准"4+ before committing"）
    # 参考 126982: 4:35 达到 4 只；单 VS 变体约 4:30-4:50
    # plan: UnitExists(PHOENIX,4) 是第 2 VS 触发条件，必然在此前达到

  - id: assimilator_4
    type: building_complete
    unit: ASSIMILATOR
    by: "4:30"
    # 第 4 气矿（三气 / 四气补满双矿）；参考 126982: 3:47 建第 3 批 3 个 Assimilator
    # plan: UnitExists(NEXUS,2) → BuildGas(4)；凤凰集结期间补四气

  - id: phoenix_eight
    type: unit_count
    unit: PHOENIX
    at: "6:00"
    tol: 40
    min: 8
    # 8 只凤凰集结；参考 126982: 5:23 达到 8 只。
    # 2026-05-27 task #356：_ready_to_pressure 改 phoenix >= 5（出门骚扰 gate），
    # 8 只凤凰存在仍需验证（三矿 + 骚扰持续期间需要足够数量）。
    # 窗口 6:00±40 覆盖实际节奏。

  - id: robo_facility
    type: building_complete
    unit: ROBOTICSFACILITY
    by: "6:30"
    # Observer 反隐；参考 126982: 5:30 建 Robo（50s）→完成约 6:20
    # 参考 149968: 4:14 建 Robo→完成约 5:04（更激进变体，早 Colossus 转型）
    # plan: UnitExists(PHOENIX,6) 触发 Robo；6 只凤凰约 5:00-5:10→Robo 建造→完成约 6:00-6:20

  - id: observer_count
    type: unit_count
    unit: OBSERVER
    by: "7:00"
    min: 1
    # Observer（反隐必须）；Robo 完成后立刻产，产出约 25s
    # 参考 149968: Observer chrono @5:04
    # plan: UnitReady(ROBOTICSFACILITY,1) → ProtossUnit(OBSERVER,2)

  - id: worker_count_4min
    type: worker_count
    at: "4:00"
    tol: 30
    min: 26
    # 双矿 4 分钟农民数；参考 126982: 4:00 时约 26-27 探机（早期快双矿路线）
    # plan: ActUnit(PROBE, NEXUS, 60)，持续补农

  - id: worker_count_5min
    type: worker_count
    at: "5:00"
    tol: 30
    min: 36
    # 5 分钟农民；参考 126982: 5:00 时约 40+ 探机（双矿运营）
    # 给较保守下界 36（单 VS 路线比双 VS 路线多时间补农）

  - id: nexus_3
    type: building_complete
    unit: NEXUS
    by: "8:00"
    # 三矿；参考 126982: 7:37 才下三矿（比 plan 晚，因为参考来源双 VS 消耗矿多）
    # plan: UnitExists(PHOENIX,8) 触发 Expand(3)；8 凤凰约 5:30-6:00→三矿约 6:00 开建→完成约 7:10
    # 给宽松 by 8:00（task #356：5 凤凰出门骚扰 gate，8 凤凰三矿 gate 不变）

  - id: army_gather
    type: army_gather
    at: "5:10"
    near: home
    within: 55
    # 凤凰成军前在 home 集结；参考 126982: 8 凤凰 @5:23 → 立刻出门。
    # 空军质心波动大，within 放宽到 55

  # 注:原 attack_moveout check 已移除 —— 凤凰既是骚扰单位又是主力,接入
  # PhoenixHarassAct 后凤凰逐个产出、逐个去骚扰,army_center 质心越过出门
  # 阈值天然偏晚且方差大(trickle 骚扰 vs group 出门的度量错配)。凤凰攻势
  # 由下面的 harass_worker_kills 验证即可,group-attack 的出门度量不适用。

  # --- L3 骚扰验收：是否真打到敌方农民 ---
  - id: harass_worker_kills
    type: harass_damage
    by: "7:00"
    min: 3
    # 两矿凤凰——凤凰提起农民点杀,必须真打到农民(打到即算,不强求击杀),造出凤凰≠骚扰到位。
    # enemy_workers_harassed = telemetry 敌方块「被我方打到过(受伤∪阵亡)的敌方农民」累计;
    # 截至 7:00 应 >= 3。min 设保守:先立可度量的底线,不求完美。
