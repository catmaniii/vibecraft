# 虫族中央别名表（M5+ 范围，当前未启用）
#
# 状态：占位 skeleton。MVP (v0.1) 仅神族,虫族 v1.5 加。
# 格式跟 protoss.yaml 完全一致(buildings / units / upgrades 三组,
# default_display + aliases + hotkey)。
#
# 虫族建筑 hotkey 由 Drone build menu 决定(B/V 分基础/高级),
# 启用时按 Liquipedia Standard 布局查准。
#
# 当前 LLM prompt 只加载 protoss.yaml,本文件占位不参与解析。

buildings:
