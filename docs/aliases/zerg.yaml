    aliases: [幼虫, Larva]
  Queen:
    default_display: "女王"
    aliases: [女王, 后, Queen]
  Zergling:
    default_display: "小狗"
    aliases: [小狗, 跳虫, 狗, Ling, Zergling]
  Baneling:
    default_display: "爆虫"
    aliases: [爆虫, 自杀虫, 妖虫, Baneling]
  Roach:
    default_display: "蟑螂"
    aliases: [蟑螂, 小强, Roach]
  Ravager:
    default_display: "破坏者"
    aliases: [破坏者, 大蟑螂, Ravager]
  Hydralisk:
    default_display: "刺蛇"
    aliases: [刺蛇, 龙, Hydra, Hydralisk]
  Lurker:
    default_display: "潜伏者"
    aliases: [潜伏者, 地刺, Lurker]
  Infestor:
    default_display: "感染虫"
    aliases: [感染虫, 感染, Infestor]
  SwarmHost:
