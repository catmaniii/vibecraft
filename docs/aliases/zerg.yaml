# 虫族中央别名表（M6.2a）
#
# 格式跟 protoss.yaml 完全一致(buildings / units / upgrades 三组,
# default_display + aliases + hotkey)。
#
# 虫族建筑 hotkey：Drone build menu 分两层 B（基础）+ V（高级）
# B 系：Hatchery(BH) / Extractor(BE) / SpawningPool(BS) / EvolutionChamber(BV)
#        RoachWarren(BR) / BanelingNest(BB) / SpineCrawler(BC) / SporeCrawler(BP)
# V 系：HydraliskDen(VH) / LurkerDen(VL) / InfestationPit(VI) / Spire(VS)
#        NydusNetwork(VN) / UltraliskCavern(VU)

buildings:
  Hatchery:
    default_display: "BH"
    aliases: [BH, 孵化, 基地, 一本, 孵化场, Hatchery]
    hotkey: "B+H"
  Lair:
    default_display: "Lair"
    aliases: [虫穴, 二本, Lair]
  Hive:
    default_display: "Hive"
    aliases: [主巢, 三本, Hive]
  Extractor:
    default_display: "BE"
    aliases: [BE, 气矿, 气, Extractor]
    hotkey: "B+E"
  SpawningPool:
    default_display: "BS"
    aliases: [BS, 母池, 狗洞, SpawningPool]
    hotkey: "B+S"
  EvolutionChamber:
    default_display: "BV"
    aliases: [BV, 进化腔, 升级巢, EvolutionChamber]
    hotkey: "B+V"
  RoachWarren:
    default_display: "BR"
    aliases: [BR, 蟑螂巢, RoachWarren]
    hotkey: "B+R"
  BanelingNest:
    default_display: "BB"
    aliases: [BB, 爆虫巢, 自杀虫巢, BanelingNest]
    hotkey: "B+B"
  SpineCrawler:
    default_display: "BC"
    aliases: [BC, 刺蛇塔, 防御塔, SpineCrawler]
    hotkey: "B+C"
  SporeCrawler:
    default_display: "BP"
    aliases: [BP, 孢子塔, 防空塔, SporeCrawler]
    hotkey: "B+P"
  HydraliskDen:
    default_display: "VH"
    aliases: [VH, 刺蛇巢, 龙穴, HydraliskDen]
    hotkey: "V+H"
  LurkerDen:
    default_display: "VL"
    aliases: [VL, 潜伏者巢, 地刺巢, LurkerDen]
    hotkey: "V+L"
  InfestationPit:
    default_display: "VI"
    aliases: [VI, 感染深渊, InfestationPit]
    hotkey: "V+I"
  Spire:
    default_display: "VS"
    aliases: [VS, 尖塔, 飞龙塔, Spire]
    hotkey: "V+S"
  GreaterSpire:
    default_display: "GreaterSpire"
    aliases: [大尖塔, GreaterSpire]
  NydusNetwork:
    default_display: "VN"
    aliases: [VN, 虫巢网络, NydusNetwork]
    hotkey: "V+N"
  UltraliskCavern:
    default_display: "VU"
    aliases: [VU, 雷兽巢, UltraliskCavern]
    hotkey: "V+U"

units:
  Drone:
    default_display: "农民"
    aliases: [农民, 工蜂, Drone]
  Overlord:
    default_display: "OL"
    aliases: [OL, 王虫, 监工, Overlord]
  Overseer:
