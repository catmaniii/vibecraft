    aliases: [腐化者, 腐化, Corruptor]
  Viper:
    default_display: "毒蛇"
    aliases: [毒蛇, Viper]
  NydusWorm:
    default_display: "虫洞"
    aliases: [虫洞, NydusWorm]
  Ultralisk:
    default_display: "雷兽"
