# 人族中央别名表（M5+ 范围，当前未启用）
#
# 状态：占位 skeleton。MVP (v0.1) 仅神族,人族 v1.5 加。
# 格式跟 protoss.yaml 完全一致(buildings / units / upgrades 三组,
# default_display + aliases + hotkey)。
#
# 实际启用时:
# 1. 填补每个 building / unit / upgrade entry
# 2. 改 strategies/ 加 terran/ 目录 + 至少 1 个剧本
# 3. config/race.yaml 加 terran 配置
# 4. AliasTable.from_yaml 支持按种族切换 / 合并
#
# 当前 LLM prompt 只加载 protoss.yaml,本文件占位不参与解析。

