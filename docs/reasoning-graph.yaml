# 项目推理图谱 · 机读单一源（通用，不绑单一功能）
#
# 权威格式见全局 skill ~/.claude/skills/reasoning-graph/SKILL.md（这是唯一真理源，改这里）。
# 人读版 docs/reasoning-graph.md 已废弃（迁进全局 skill，2026-07-14 批 F）；可视化改用全局
# skill 的交互式 viewer（assets/rg-viewer.html，拖拽本文件或经 /rg 路由注入即可看）。
# 一致性门是全局 skill 的 scripts/rg_validate.py（无环 + 不确定性传播 + schema 等校验），
# tests/unit/test_reasoning_graph.py 是薄壳、subprocess 调用它校验本文件。
#
# 这是一张纯有向无环图（DAG）：结论只靠 deps 边组织、不靠层级。任何判断都能顺依赖链回到已验证
# 的根（API/真机/实测）。按 domain 分子树（如 nydus-landing），新领域加自己的节点。
#
# 字段/分类模型权威见 skill 的 SCHEMA.md。两个正交维度:
#   kind   建号后不可变: fact(可复核观察) | inference(从deps推出) | decision(选择/承诺,无真值) |
#          question(待答问题,无真值;任何节点不得依赖它)
#   status 按 kind 分: fact/inference=verified|unverified|retracted;
#          decision=active|inactive(生命周期,非真值;代码回退的标 inactive);
#          question=open|answered(带answered_by)|dropped
#   deps 指向任意节点(fact/question 可空作根;inference/decision 必须非空;都不得依赖 question)
#   下面 config 块声明本项目方言(provenance/by 词表、id前缀↔kind、语义规则)

review:
  last_reviewed: "2026-07-28"

# 左上角项目标题(viewer 顶层可选 title;缺省显示模板通用的"项目推理图谱")。
title: "vibecraft 项目推理图谱"

version: 4

# 本项目的"方言"声明(可选;skill 通用骨架之外,vibecraft 自己的分类词表 + 语义规则)。
# 不声明这块的项目,skill 只强制通用骨架(DAG/kind/status/传播/changelog)——这就是可移植的关键:
# skill 不把 vibecraft 的 provenance/by 词表强加给别的项目。格式见 skill 的 SCHEMA.md「项目方言」。
config:
  # 本项目额外必填字段(通用核心 id/kind/statement/deps/status 之外)
  required_fields: [domain, title, evidence]
  node_id_pattern: "^[FIDQ]\\d+$" # F=fact / I=inference / D=decision / Q=question
  id_prefix_by_kind: {fact: F, inference: I, decision: D, question: Q}
  domain_pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  # fact 的来源子类型:环境(游戏/API)/纯代码/纯数学/实测
  fact_provenance_values: [env-game, env-api, own-code, math, empirical, doc]
  # decision 的决策主体:玩家拍板 / agent(AI)设计
  decision_by_values: [player, agent]
  # inference 的推导子类型:演绎(前提真则结论必然真) / 可废止(归纳溯因,须经验验证,缺省)
  inference_derivation_values: [deductive, defeasible]
  # 实测 fact 必须有 repro(可复现命令/log 背书)
  require_repro_for_provenance: [empirical]
  # 纯数学 fact 不该建在某次实测上
  forbid_provenance_dep:
    - {from: math, to: empirical}

