name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks 要扫历史

      # secret 扫描:pre-commit 只在本地跑,PR 里挡不住 —— CI 侧再扫一道(含完整历史)。
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dev dependencies
        # sc2-lib = 只装 python-sc2 本体（纯 Python）。没有它，23 个单测文件会因
        # `No module named 'sc2'` 直接 collect 失败。完整的 sc2 extra 装不了：
        # sc2-helper 只有 cp311 wheel，3.12 那条腿会挂。
        run: uv sync --extra dev --extra sc2-lib

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/vibecraft

      - name: Pytest (unit + integration)
        run: uv run pytest --cov --cov-report=term-missing -m "not e2e"
