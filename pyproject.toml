[project]
name = "vibecraft"
version = "0.1.0a1"
description = "用语音 + 文字指挥 AI 替你操作 SC2 神族"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "VibeCraft team" }]

dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "anyio>=4.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "websockets>=12.0",
    "click>=8.1",
    "qrcode>=7.4",
]

[project.optional-dependencies]
# 开发工具链
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]
# 端到端依赖（真实 SC2 + ares-sc2）。ares-sc2 / burnysc2 / map-analyzer 都不在
# PyPI（git 源），所以单独成 extra —— 日常 `uv sync --extra dev` 不会装它们，
# 只有要跑 smoke / M1.5 ares_adapter 才 `uv sync --extra dev --extra sc2`。
# uv 用户靠下方 [tool.uv.sources] 解析 git URL；pip 用户走 runbook §1 手动装。
sc2 = [
    "ares-sc2",
    "sc2-helper>=0.2.1",
]

[project.scripts]
vibecraft = "vibecraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibecraft"]

# ----------------------------------------------------------------------
# uv sources —— 把 sc2 extra 里的 git 依赖映射到源（uv 专用，pip 不读这段）。
# 根治「`uv sync` 把 ares 全家桶清掉」的问题：之前 ares 是 `uv pip install`
# 旁路装的、不在 pyproject 声明里，任何 `uv sync` 都会清掉它们。
# burnysc2 / map-analyzer 是 ares-sc2 的传递依赖，显式列源保证用对 URL。
# `ares_sc2_src.pth`（修 ares-sc2 src-layout 打包 bug）仍需手动建，见 runbook §1。
# ----------------------------------------------------------------------
[tool.uv.sources]
ares-sc2 = { git = "https://github.com/AresSC2/ares-sc2", branch = "main" }
burnysc2 = { git = "https://github.com/august-k/python-sc2", branch = "develop" }
map-analyzer = { git = "https://github.com/spudde123/SC2MapAnalysis", branch = "develop" }

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["scripts/_vendor/*", "vendor/"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # bugbear
    "UP",         # pyupgrade
    "C4",         # comprehensions
    "SIM",        # simplify
    "RET",        # return
    "TID",        # tidy imports
    "PTH",        # pathlib
    "ASYNC",      # async best practices
    "RUF",        # ruff-specific
]
ignore = [
    "E501",       # line too long — handled by formatter
    "B008",       # function call in default — fine for FastAPI-style deps
    "SIM108",     # ternary — sometimes if/else is clearer
    "RUF001",     # ambiguous string char — 中文项目，全角符号是正常的
    "RUF002",     # ambiguous docstring char — 同上
    "RUF003",     # ambiguous comment char — 同上
    "UP042",      # (str, Enum) vs StrEnum — StrEnum 改 __str__ 行为，影响序列化
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]      # asserts and magic numbers OK in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["vendor/"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ares.*", "sc2.*", "ares_sc2.*", "burnysc2.*", "qrcode.*", "bot.*", "sharpy.*", "config", "s2clientprotocol.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "integration: 集成测试 (mock python-sc2, 不需要真实 SC2 实例)",
    "e2e: 端到端测试 (需要真实 SC2 客户端, default 跳过)",
    "slow: 慢速测试",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
branch = true
source = ["src/vibecraft"]
omit = [
    "*/__init__.py",
    "*/cli.py",                    # CLI 入口，靠端到端覆盖
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
precision = 1
show_missing = true
skip_covered = false
