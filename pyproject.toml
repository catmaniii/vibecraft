warn_required_dynamic_aliases = true

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "integration: 集成测试 (mock python-sc2, 不需要真实 SC2 实例)",
    "e2e: 端到端测试 (需要真实 SC2 客户端, default 跳过)",
    "slow: 慢速测试",
    "llm_eval: 纯 LLM 解析正确率测试 (真调 LLM API, default 跳过, 用 -m llm_eval 才跑)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    # Windows ProactorEventLoop GC timing：asyncio 在对象析构时发 ResourceWarning，
    # 触发 PytestUnraisableExceptionWarning；这是已知的 Windows/asyncio 问题，
    # 与测试顺序相关（test_server_http 的 event loop 在其他测试 GC 时被回收）。
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src/vibecraft"]
omit = [
    "*/__init__.py",
    "*/cli.py",                    # CLI 入口，靠端到端覆盖
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
precision = 1
show_missing = true
skip_covered = false
