[project]
name = "vibecraft"
version = "0.1.0a1"
description = "用语音 + 文字指挥 AI 替你打星际2（三族）—— 给操作不动了的老玩家"
readme = "README.md"
# 只支持 3.11。不是保守，是硬约束：vendored sharpy 的核心 manager 无条件
# `import sc2pathlib`，而上游只提供了 `sc2pathlib.cp311-win_amd64.pyd` 这一个编译产物。
# 3.12 上装得完全正常、一跑 bot 就在 sharpy 深处 ImportError —— 与其让人踩这个坑，
# 不如在安装时就说清楚。（同理：本项目只在 Windows 上可用。）
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "catmaniii", email = "vibecraftproject@gmail.com" }]
keywords = ["starcraft2", "sc2", "bot", "llm", "voice-control", "rts", "accessibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]


dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "anyio>=4.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "websockets>=12.0",
    "click>=8.1",
    "qrcode[pil]>=7.4",  # [pil]=Pillow，/api/qr 渲染高清 PNG 需要
    "aiortc>=1.14.0",
    "av>=16.1.0",
    "mss>=10.2.0",
    "pygetwindow>=0.0.9",
    "numpy>=2.4.5",
    "loguru>=0.7",  # sharpy 的 plan 用它打日志，我们自己的 act 也直接 import
    "pyaudiowpatch>=0.2.12.7 ; sys_platform == 'win32'",
    "comtypes>=1.4 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/catmaniii/vibecraft"
Repository = "https://github.com/catmaniii/vibecraft"
Issues = "https://github.com/catmaniii/vibecraft/issues"
Changelog = "https://github.com/catmaniii/vibecraft/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# FunASR 语音识别（torch ~GB，仅真机阶段装）。缺失时语音功能禁用，server 正常启动。
# 安装：uv sync --extra asr  或  uv pip install funasr
asr = ["funasr"]
# 开发工具链
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]
# **让 vendored sharpy 能 import 起来的最小依赖集**（不连游戏，纯 import 用）。
# 单独拆出来是因为 CI 要用它：没有这些，几百个单测文件在 collect 阶段就炸，等于那部分 bot
# 逻辑在 CI 上一行没跑过。踩过的坑：vendored sharpy 有自己的 requirements.txt，但它**从来
# 没被并进本 pyproject** —— 于是干净克隆装完 `uv sync` 得到的 sharpy 是坏的，只有开发者
# 本机因为残留着当初 clone 的包而"一切正常"。这里逐个对齐它真正 import 的东西：
#   burnysc2     —— `sc2.*`（python-sc2 本体，纯 Python）
#   scikit-learn —— sharpy/combat/group_combat_manager.py 顶层 `from sklearn.cluster import DBSCAN`
# 不需要的：opencv-python（cv2 只在 sc2pathlib/map.py 的 debug 画图函数内惰性 import）、
# requests / six / more-itertools（sharpy 的 requirements 里有，但源码里根本没 import）。
# 其余（aiohttp / numpy / scipy / mpyq / portpicker / protobuf / loguru）由 burnysc2 带进来。
sc2-lib = [
    "burnysc2",
    "scikit-learn<2.0.0",
]

[project.scripts]
vibecraft = "vibecraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibecraft"]

# ----------------------------------------------------------------------
# uv sources —— python-sc2 不在 PyPI，只有 git 源（uv 专用，pip 不读这段）。
# 显式声明在这里，`uv sync --extra sc2-lib` 才能把它装上；旁路 `uv pip install` 装的东西
# 会被下一次 `uv sync` 清掉。
# ----------------------------------------------------------------------
[tool.uv.sources]
burnysc2 = { git = "https://github.com/august-k/python-sc2", branch = "develop" }

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["scripts/_vendor/*", "vendor/"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # bugbear
    "UP",         # pyupgrade
    "C4",         # comprehensions
    "SIM",        # simplify
    "RET",        # return
    "TID",        # tidy imports
    "PTH",        # pathlib
    "ASYNC",      # async best practices
    "RUF",        # ruff-specific
]
ignore = [
    "E501",       # line too long — handled by formatter
    "B008",       # function call in default — fine for FastAPI-style deps
    "SIM108",     # ternary — sometimes if/else is clearer
    "RUF001",     # ambiguous string char — 中文项目，全角符号是正常的
    "RUF002",     # ambiguous docstring char — 同上
    "RUF003",     # ambiguous comment char — 同上
    "UP042",      # (str, Enum) vs StrEnum — StrEnum 改 __str__ 行为，影响序列化
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # 测试里 assert 是本职
    "PLR2004",  # 测试里 magic number 可读性更好
    "RUF012",   # 测试类里的可变类属性(参数表/夹具数据)不必标 ClassVar
    "B017",     # 有意断言"抛任何异常"的用例(测的就是"会炸",不关心具体类型)
]
# 下面这些 E402/I001 都是同一个模式:必须先 sys.path.insert 再 import 被测/被调模块
# （scripts/ 与 vendor/sharpy 不是包，装不进 site-packages）——把 import 提到顶反而跑不起来。
"tests/unit/test_build_acceptance_runner.py" = ["E402", "I001"]
"tests/unit/test_upgrade_target.py" = ["E402"]
"tests/unit/test_admin_auth.py" = ["E402"]
"tests/unit/test_build_acceptance_exec_quality.py" = ["E402"]
"tests/unit/test_structure_override_exec.py" = ["E402"]
# 自验脚本:轮询真实外部状态(SC2 子进程/TURN 服务器)只能 sleep 轮询,没有可等的 Event;
# `timeout` 参数是脚本 CLI 的一部分,不是 asyncio 反模式。
"scripts/*_selftest.py" = ["ASYNC110"]
"deploy/turn/turn_selftest.py" = ["ASYNC109", "ASYNC110"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# VibeCraft 只在 Windows 跑（SC2 客户端 + PowerShell 启动脚本），代码里到处是
# `if sys.platform != "win32": return` 的守卫。不钉死平台的话，mypy 在 Linux CI 上会把
# sys.platform 收窄成 "linux"、判定守卫恒真 → 守卫之后的 Windows 实现全被报成 unreachable，
# 且 ctypes.WinDLL / windll / HRESULT 这些 Windows-only 属性全部 attr-defined。
# 钉成 win32 后，CI 与开发机检查的是同一批代码路径。
platform = "win32"
strict = true
exclude = ["vendor/"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sc2.*", "burnysc2.*", "qrcode.*", "bot.*", "sharpy.*", "config", "s2clientprotocol.*"]
ignore_missing_imports = true

# 这几个包在 Linux CI 上装不到，且是**故意**的：
#   comtypes / pyaudiowpatch —— dependencies 里带 `sys_platform == 'win32'` 标记，非 Windows 不装；
#   funasr —— 可选 extra（`uv sync --extra asr`），体积大，CI 不装。
# 代码里都有运行时守卫/惰性导入，所以缺了不影响 CI 跑 lint 和单测。
[[tool.mypy.overrides]]
module = ["comtypes.*", "pyaudiowpatch.*", "funasr.*"]
ignore_missing_imports = true

# 承上：这两个文件的 import 行带 `# type: ignore[import-untyped]`。
# 在 Windows 开发机上包是装着的（untyped）→ 该 ignore 有效；在 CI 上包根本不存在，被上面的
# ignore_missing_imports 吞掉 → 同一个 ignore 变成“多余”。同一行注释在两个环境里必有一边报错，
# 只能对这两个文件关掉 unused-ignore 检查。
[[tool.mypy.overrides]]
module = ["vibecraft.server.process_loopback", "vibecraft.server.audio_grab"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── 历史欠账：下列模块暂时放宽的错误码（2026-07-27 开源前）────────────────────
# 为什么这么做：整仓 strict 下这些文件累计 279 条错误（其中 154 条 union-attr 集中在
# director.py）。一次性修完风险大、且与功能开发争抢时间；但把 mypy 从 CI 里删掉会让**新代码**
# 也失去类型保护。折中：**只对这些既有文件、只对它们实际触发的错误码**放宽，其余代码和所有
# 新增文件仍然 strict —— CI 因此是绿的，欠账也在这里被显式列出来，逐个还清后删掉对应条目即可。

[[tool.mypy.overrides]]
module = "vibecraft.bot.director"
disable_error_code = ["arg-type", "assignment", "attr-defined", "no-any-return", "type-arg", "union-attr", "unreachable", "unused-ignore"]

[[tool.mypy.overrides]]
module = "vibecraft.bot.auto_combat.common_bot"
