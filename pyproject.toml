[project]
name = "voicecraft"
version = "0.1.0a1"
description = "用语音 + 文字指挥 AI 替你操作 SC2 神族"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "VoiceCraft team" }]

dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "anyio>=4.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "websockets>=12.0",
    "click>=8.1",
    "qrcode>=7.4",
]

[project.optional-dependencies]
# 开发工具链
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[project.scripts]
voicecraft = "voicecraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicecraft"]

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["scripts/_vendor/*"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # bugbear
    "UP",         # pyupgrade
    "C4",         # comprehensions
    "SIM",        # simplify
    "RET",        # return
    "TID",        # tidy imports
    "PTH",        # pathlib
    "ASYNC",      # async best practices
    "RUF",        # ruff-specific
]
ignore = [
    "E501",       # line too long — handled by formatter
    "B008",       # function call in default — fine for FastAPI-style deps
    "SIM108",     # ternary — sometimes if/else is clearer
    "RUF001",     # ambiguous string char — 中文项目，全角符号是正常的
    "RUF002",     # ambiguous docstring char — 同上
    "RUF003",     # ambiguous comment char — 同上
    "UP042",      # (str, Enum) vs StrEnum — StrEnum 改 __str__ 行为，影响序列化
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]      # asserts and magic numbers OK in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ares.*", "sc2.*", "ares_sc2.*", "burnysc2.*", "qrcode.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "integration: 集成测试 (mock python-sc2, 不需要真实 SC2 实例)",
    "e2e: 端到端测试 (需要真实 SC2 客户端, default 跳过)",
    "slow: 慢速测试",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
branch = true
source = ["src/voicecraft"]
omit = [
    "*/__init__.py",
    "*/cli.py",                    # CLI 入口，靠端到端覆盖
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
precision = 1
show_missing = true
skip_covered = false
