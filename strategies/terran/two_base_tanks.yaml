kind: opening_build
id: two_base_tanks
display_name_zh: "双基地坦克压制"
summary_zh: "双矿坦克 + 枪兵阵地战：坦克展开防守线 + Marine 保护坦克，逐步推进对方；对付蟑螂 / 不朽的核心手段"
sharpy_dummy_class: "vibecraft.bot.auto_combat.terran.plans.two_base_tanks:TwoBaseTanks"
aliases:
  - "two_base_tanks"
  - "双基坦克"
  - "坦克流"
  - "坦克压制"
  - "mech"
  - "机械流"
  - "tank push"
  - "推进坦克"

enter_when:
  - "self.tech.siege_tech.done"
  - "self.expansion_count >= 2"
  - "from_opening in [marine_rush, reaper_expand]"

# Phase stepper（2026-05-19 加上，PWA strategy card 显示 milestone 进度）
phases:
  - id: economic_open
    display: "双矿 + 双 Factory"
    subtitle: "二矿 / Refinery×2 / Factory×2"
    start_at_time: 0
  - id: tank_tech
    display: "起 SiegeTech"
    subtitle: "~4:00 TechLab + SiegeTech 研究"
    start_at_time: 240
  - id: tank_mass
    display: "暴坦克 + 维京"
    subtitle: "~6:00 4 坦克 + 2 维京 + 12 兵到位"
    start_at_time: 360
  - id: combined_arms
    display: "MMM + 坦克阵地"
    subtitle: "~7:30 6 坦克 + 12 兵 + 2 医疗船就位"
    start_at_time: 450
  - id: attack_timing
    display: "9:00 推进"
    subtitle: "坦克展开慢推，配合维京制空、医疗船救援"
    start_at_time: 540

commitments:
  units:
    marine: 12
    siege_tank: 6
    medivac: 2
    viking: 4
  tech: [SiegeMode, Stimpack]
  structures:
    factory: 2
    barracks: 2
    starport: 1
    engineering_bay: 1
  expansions: 2

attack_window:
  open_at: "9:00"
  close_at: "11:00"
  target_priority: [army, natural, production]

micro_doctrine:
  - "坦克展开后 Marine 保护侧翼"
  - "推进时坦克交替展开，始终保持火力覆盖"
  - "Viking 护卫对方空军 / 清视野"
  - "Medivac 在坦克阵地后方治疗 Marine"
  - "对方 Colossus：Viking 点名"

lategame_transitions:
  - lategame_id: persistent_skyterran
    when: "default"
  - lategame_id: persistent_skyterran
    when: "game_time >= 14:00"
