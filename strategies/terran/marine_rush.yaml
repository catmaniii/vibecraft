kind: opening_build
id: marine_rush
display_name_zh: "枪兵速攻"
summary_zh: "1 BB 速出枪兵骚扰：早期兵营 + 刺激剂研发，快速推进对方矿线，通过持续骚扰打乱对方节奏"
sharpy_dummy_class: "vibecraft.bot.auto_combat.terran.plans.marine_rush:MarineRush"
aliases:
  - "marine_rush"
  - "枪兵rush"
  - "枪兵速攻"
  - "速枪兵"
  - "1BB"
  - "bio rush"
  - "marine M&M"
  - "早期枪兵"
matchup: [TvT, TvZ, TvP]

phases:
  - id: opening
    display: "速 BB"
    subtitle: "12 农 → 1 BB + 科技室，研刺激剂"
