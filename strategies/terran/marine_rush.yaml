  - id: building
    display: "持续出兵"
    subtitle: "BB 完成 → 持续出枪兵，补 BS"
    start_at_supply: 16
  - id: pressure
    display: "出门骚扰"
    subtitle: "8-12 枪兵出门压制对方矿线"
    start_at_supply: 22
    start_at_time: 180

steps:
  - "10 build SupplyDepot"
  - "12 build Barracks"
  - "13 build Refinery"
  - "15 build SupplyDepot"
  - "16 train Marine"
  - "17 build TechLab @Barracks"
  - "18 research Stimpack"
  - "19 train Marine"
  - "19 train Marine"
  - "22 build Barracks"
  - "25 build SupplyDepot"

default_transitions:
  - midgame_id: bio_stim
    when: "default"
  - midgame_id: two_base_tanks
    when: "enemy.heavy_ground"
