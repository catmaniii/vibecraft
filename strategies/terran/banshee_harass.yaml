    start_at_time: 420  # 2026-06-18 #548 同步代码:cloak 实测 ~418s，骚扰窗口 360-450s，改 420
  - id: eco
    display: "双基地经济"
    display_en: "2-Base Economy"
    subtitle: "骚扰同时开二矿 + 升轨道，补 Marine 保家"
    subtitle_en: "Expand simultaneously → Orbital Command upgrade, supplement Marines for defense"
    start_at_supply: 30
    start_at_time: 360  # 2026-06-18 #548 同步代码:CC2 完成实测 ~369s(spec 6:15±60s)，改 360

steps:
  - "14 build SupplyDepot"
  - "15 build Barracks"
  - "16 build Refinery"
  - "18 build Factory"
  - "19 build Refinery"
  - "20 build Starport"
  - "21 build TechLab @Starport"
  - "22 research BansheeCloak"
  - "24 train Banshee"
  - "24 train Banshee"
  - "26 build CommandCenter"
  - "28 train Marine"
  - "30 build SupplyDepot"

default_transitions:
  - midgame_id: bio_stim
    when: "default"
  - midgame_id: two_base_tanks
    when: "enemy.heavy_armor"
