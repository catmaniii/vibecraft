sharpy_dummy_class: "vibecraft.bot.auto_combat.terran.plans.banshee_harass:BansheeHarass"
# 中期运营配比(build-aware sustain，2026-06-15 用户锁定)
core_units:
  - {unit: MARINE, policy: mass}
  - {unit: BANSHEE, policy: cap, value: 6}
  - {unit: SIEGETANK, policy: cap, value: 3}
  - {unit: MEDIVAC, policy: ratio, per: bio, n: 8}
aliases:
  - "banshee_harass"
  - "隐形女妖偷袭"
  - "隐形女妖"
  - "女妖骚扰"
  - "女妖偷袭"
  - "隐形女妖rush"
  - "banshee harass"
  - "cloak banshee"
  - "女妖rush"
  - "速女妖"
  - "女妖流"
matchup: [TvP, TvZ]

phases:
