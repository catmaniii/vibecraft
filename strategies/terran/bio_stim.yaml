kind: opening_build
id: bio_stim
display_name_zh: "生化刺激剂中期"
summary_zh: "双矿生化 + 刺激剂：Marine + Marauder + Medivac 三件套，刺激剂 + 医疗船全力压制，timing 8:00-9:30 出门"
sharpy_dummy_class: "vibecraft.bot.auto_combat.terran.plans.bio_stim:BioStim"
aliases:
  - "bio_stim"
  - "生化刺激"
  - "MMM"
  - "bio"
  - "枪兵掠夺者"
  - "枪兵流"
  - "生化流"
  - "M&M"
  - "bio push"

enter_when:
  - "self.tech.stimpack.done"
  - "self.expansion_count >= 2"
  - "from_opening in [marine_rush, reaper_expand]"

# Phase stepper（2026-05-19 加上，PWA strategy card 显示 milestone 进度）
phases:
  - id: economic_open
    display: "双矿 + Factory"
    subtitle: "二矿 / Refinery×2 / Factory（医疗船前置）"
    start_at_time: 0
  - id: tech_lab_stim
    display: "TechLab + 刺激剂"
    subtitle: "~3:30 TechLab，启动 Stimpack 研究"
    start_at_time: 210
  - id: marauder_medivac
    display: "Marauder + Medivac"
    subtitle: "~5:00 第一波医疗船 + Marauder 到位"
    start_at_time: 300
  - id: bio_mass
    display: "MMM 三件套就位"
    subtitle: "~6:30 20 兵 + 6 强袭兵 + 3 医疗船"
    start_at_time: 390
  - id: attack_timing
    display: "8:00 stim 一波"
    subtitle: "全军 stim 压向对方分矿，配合 drop 多线"
    start_at_time: 480

commitments:
  units:
    marine: 20
    marauder: 10
    medivac: 4
    ghost: 2
  tech: [Stimpack, CombatShield, ConcussiveShells]
  structures:
    barracks: 3
    factory: 1
    starport: 1
    engineering_bay: 1
  expansions: 2

attack_window:
  open_at: "8:00"
  close_at: "9:30"
  target_priority: [army, production, natural]

micro_doctrine:
  - "刺激剂爆发时 Marine 前压，掠夺者打装甲"
  - "Medivac 跟随 Marine 治疗，血少的 Marine 优先治"
  - "对方 Colossus / 坦克：Ghost EMP + Marauder 集火"
  - "Marine 站位 spread，避免 Storm / Fungal 集火"
  - "Medical kite：Medivac 撤到安全位后继续 heal"

lategame_transitions:
  - lategame_id: persistent_skyterran
    when: "default"
  - lategame_id: persistent_skyterran
    when: "game_time >= 13:00"
