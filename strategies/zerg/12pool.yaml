kind: opening_build
id: 12pool
display_name_zh: "12 母池快攻"
display_name_en: "12 Pool Rush"
summary_zh: "12 农民就开 BS，极速出狗压制：12 农 → BS → 持续出狗 + 补 OL，早期骚扰对方扩张节奏"
summary_en: "12-worker Spawning Pool, early Zergling flood: 12 workers → Pool → continuous Zerglings + Overlords, early pressure to disrupt opponent's expansion timing."
sharpy_dummy_class: "vibecraft.bot.auto_combat.zerg.plans.twelve_pool:TwelvePool"
# 中期运营配比(build-aware sustain，2026-06-15 用户锁定)
core_units:
  - {unit: ZERGLING, policy: mass}
aliases:
  - "12pool"
  - "12Pool"
  - "十二母池"
  - "速母池"
  - "速BS"
  - "快攻"
  - "狗rush"
  - "Zergling Rush"
  - "12P"
matchup: [ZvT, ZvZ, ZvP]

phases:
  - id: opening
    display: "12 农 开 BS"
    display_en: "12 Workers → Spawning Pool"
    subtitle: "12 农民就开 SpawningPool，同时造 Overlord"
    subtitle_en: "12 workers → Spawning Pool immediately, Overlord simultaneously"
    start_at_supply: 12
  - id: flooding
    display: "速出狗"
    display_en: "Zergling Flood"
    subtitle: "BS 完成即出狗，持续刷满幼虫"
    subtitle_en: "Pool done → immediate Zerglings, fill all larvae"
    start_at_supply: 16
  - id: pressure
    display: "出门骚扰"
    display_en: "Pressure"
    subtitle: "6-8 只狗出门，打对方早期扩张"
    subtitle_en: "6-8 Zerglings move out, attack enemy early expansion"
    start_at_supply: 22
    start_at_time: 120

steps:
  - "9 build Overlord"
  - "12 build SpawningPool"
  - "16 build Queen"
  - "16 train Zergling"
  - "16 train Zergling"
  - "16 train Zergling"
  - "18 build Hatchery"
  - "22 train Zergling"
  - "22 train Zergling"

default_transitions:
  - midgame_id: roach_hydra
    when: "default"
  - midgame_id: mutalisk_harass
    when: "enemy.macro_opening"

# 12pool cheese 没结束游戏 → 转持续运营(蟑螂+刺蛇+毒蛇,延续地面军风格)
lategame_transitions:
  - lategame_id: persistent_roach_hydra_viper
    when: "default"
  - lategame_id: persistent_roach_hydra_viper
    when: "game_time >= 8:00"
