kind: opening_build
id: zvp_macro
display_name_zh: "ZvP 运营流"
display_name_en: "ZvP Macro Opener"
summary_zh: "对神族 hatch-first 运营：16 二矿 → 快三矿 → 孢子防空(防 Oracle/DT) → 蟑螂+刺蛇稳健过渡，多蜂后注卵防空"
summary_en: "Hatch-first macro vs. Protoss: 16 expand → fast third base → Spore Crawlers for Oracle/DT defense → Roach-Hydralisk stable transition, multiple Queens for inject and anti-air."
sharpy_dummy_class: "vibecraft.bot.auto_combat.zerg.plans.zvp_macro:ZvpMacro"
# 中期运营配比(build-aware sustain)
core_units:
  - {unit: ROACH, policy: mass}
  - {unit: HYDRALISK, policy: ratio, per: ROACH, n: 2}
  - {unit: ZERGLING, policy: light, value: 8}
aliases:
  - "zvp_macro"
  - "ZvP运营"
  - "对神族运营"
  - "虫族运营流"
  - "孢子运营"
  - "蟑刺运营"
  - "zvp macro"
matchup: [ZvP]

phases:
  - id: opening
    display: "16 二矿 hatch-first"
    display_en: "16 Hatch-First Expand"
    subtitle: "16 农开二矿 → 母池 → 第一气（先扩后池经济流）"
    subtitle_en: "16 workers → expand → Spawning Pool → first gas (hatch-first economy)"
    start_at_supply: 16
  - id: eco
    display: "快三矿 + 多蜂后"
    display_en: "Fast Third + Multiple Queens"
    subtitle: "~2:43 三矿 → 蜂后注卵 + 提速守家小虫"
    subtitle_en: "~2:43 third base → Queens inject + Zergling Speed defense"
    start_at_supply: 22
    start_at_time: 120
  - id: anti_air
    display: "孢子防空"
    display_en: "Spore Crawler Anti-air"
    subtitle: "~3:30 主矿+二矿各 2 孢子，防 Oracle 骚扰 / DT 偷家"
    subtitle_en: "~3:30 2 Spore Crawlers each at main + natural, defense vs. Oracle harass / DT sneak"
    start_at_time: 200
  - id: tech
    display: "蟑螂窝 + 进化腔 + Lair"
    display_en: "Roach Warren + Evolution Chambers + Lair"
    subtitle: "BR + BV×2 → Lair → 蟑螂速(Glial) + 1/1 攻防 → 蟑刺量产"
    subtitle_en: "Roach Warren + 2 Evolution Chambers → Lair → Glial Reconstitution + 1/1 upgrades → Roach-Hydra mass production"
    start_at_time: 230

steps:
  - "16 build Hatchery"
  - "17 build SpawningPool"
  - "18 build Extractor"
  - "21 build Queen"
  - "21 build Queen"
  - "22 train Zergling"
  - "34 build Hatchery"
  - "47 build SporeCrawler"
  - "60 build RoachWarren"
  - "75 build EvolutionChamber"

default_transitions:
  - midgame_id: roach_hydra
    when: "default"

# 3 矿运营成型 → 后期持续运营（默认蟑刺毒蛇；对天空神族转潜伏者刺蛇阵地流）
lategame_transitions:
  - lategame_id: persistent_roach_hydra_viper
    when: "default"
  - lategame_id: persistent_lurker_hydra
    when: "enemy.skytoss"
  - lategame_id: persistent_roach_hydra_viper
    when: "game_time >= 10:00"
