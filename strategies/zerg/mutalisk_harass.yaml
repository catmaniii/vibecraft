kind: opening_build
id: mutalisk_harass
display_name_zh: "飞龙骚扰中期"
summary_zh: "双矿飞龙骚扰：快出尖塔 → 12+ 飞龙持续骚扰，干扰对方生产 + 拖延经济；配合地面部队形成多线威胁"
sharpy_dummy_class: "vibecraft.bot.auto_combat.zerg.plans.mutalisk_harass:MutaliskHarass"
aliases:
  - "mutalisk_harass"
  - "飞龙骚扰"
  - "飞龙流"
  - "飞龙"
  - "muta"
  - "muta harass"
  - "muta fly"
  - "空中骚扰"

enter_when:
  - "self.tech.spire.done"
  - "self.expansion_count >= 2"
  - "from_opening in [12pool, macro_hatch]"

# Phase stepper（2026-05-19 加上，PWA strategy card 显示 milestone 进度）
phases:
  - id: economic_open
    display: "双矿运营 + 升 Lair"
    subtitle: "二矿 / 气矿 / Spawning Pool / Lair"
    start_at_time: 0
  - id: spire_up
    display: "起尖塔 Spire"
    subtitle: "~3:30 Spire 开工，准备出飞龙"
    start_at_time: 210
  - id: mutalisk_burst
    display: "暴飞龙"
    subtitle: "~5:30 第一波 6-9 飞龙，启动多线骚扰"
    start_at_time: 330
  - id: harass_phase
    display: "持续双线骚扰"
    subtitle: "飞龙骚 + 小狗压门，干扰对方经济节奏"
    start_at_time: 420
  - id: attack_timing
    display: "6:30 整合攻势"
    subtitle: "飞龙 + 小狗 + Queen 一并推上"
    start_at_time: 390

commitments:
  units:
    mutalisk: 12
    zergling: 20
    queen: 4
    overseer: 1
  tech: [MetabolicBoost]
  structures:
    spire: 1
    evolution_chamber: 1
  expansions: 2

attack_window:
  open_at: "6:30"
  close_at: "10:00"
  target_priority: [workers, production, army]

micro_doctrine:
  - "飞龙集群移动，避免分散被集火"
  - "优先骚扰对方矿区 worker"
  - "对方有防空火力时快速撤离"
  - "地面狗配合飞龙形成多线骚扰"
  - "飞龙血量低时及时回家回血"

expire_action:
  - "transition: persistent_brood_corruptor"

lategame_transitions:
  - lategame_id: persistent_brood_corruptor
    when: "default"
  - lategame_id: persistent_brood_corruptor
    when: "enemy.mass_anti_air"
