kind: lategame_doctrine
id: skytoss
display_name_zh: "Skytoss 航母流"
summary_zh: "后期航母为核心的空军体系：4 VS + Carrier + Tempest + HT/Archon + Mothership，靠空军远程 DPS 慢推"
sharpy_dummy_class: "vibecraft.bot.auto_combat.protoss.plans.skytoss:Skytoss"
aliases: ["航母流", "Skytoss", "天空", "航母收", "空军神族", "神族空军", "出航母", "憋航母"]

# 后期阶段进度（PWA 显示用，无 supply 触发条件 —— 后期没严格 supply 节点）
# PhaseTracker 看到 start_at_supply=None / start_at_time=None 时不能自动推断 phase
# 切换，玩家在 UI 上只看到第一个 phase ▶。后续可考虑加 phase_done_when 触发
# 条件（如"Carrier ≥ 8 → 进入 late_composition"）。
phases:
  - id: tech_up
    display: "上 VS + VX"
    subtitle: "Stargate + Fleet Beacon + TwilightCouncil + TemplarArchives；升 Air Weapons/Armor 1"
  - id: carrier_massing
    display: "暴航母"
    subtitle: "Fleet Beacon 完成 → 持续 Carrier，HT 攒能量自动合 Archon，研 Storm + Tempest 射程"
  - id: late_composition
    display: "完整组合"
    subtitle: "8+ Carrier + 3 Tempest + Mothership + 风暴 + 母舰罩"

target_composition:
  carrier: 12
  tempest: 3
  high_templar: 5
  archon: 4
  mothership: 1
  observer: 2

required_tech:
  - FleetBeacon
  - ProtossAirWeapons
  - ProtossAirArmor
  - PsiStorm
  - TempestGroundAttackUpgrade

required_structures:
  stargate: 4
  fleet_beacon: 1
  templar_archives: 1

engagement_doctrine:
  - "spread_units against=storm radius=6"
  - "feedback priority=[viking, ghost, infestor]"
  - "storm priority=clumped_bio min_targets=4"
  - "carrier_kite max_dist=12 retreat_when=carrier_hp<40%"
  - "mass_recall when=fleet_total_hp<40%"

win_condition:
  type: composition_advantage
  description: "靠航母远程DPS慢推，对面无法过 5 矿经济"

counters_against: [bio, roach_hydra, broodlord_infestor]
weak_against: [mass_viking, mass_corruptor, ghost_emp]
