kind: opening_build
id: iac_2base
display_name_zh: "叉球一波"
summary_zh: "纯叉子+白球一波（白球用 DT 合）：1-2 追猎火力侦查 + 8 DT 合 4 Archon + 24 Chargelot + 一攻一防升级，~7:30 出门 all-in。不出不朽，气矿全压 DT/Charge/攻防升级"
sharpy_dummy_class: "vibecraft.bot.auto_combat.protoss.plans.iac_2base:IacTwoBase"
aliases:
  - "叉球一波"
  - "叉球"
  - "叉光"
  - "叉光不朽推"
  - "叉球不朽推"
  - "白球冲锋叉一波"
  - "不朽光灵冲锋叉"
  - "重装地面"
  - "双矿叉球"
  - "双矿一波"
  - "IAC"             # 老外文术语别名，仍接受识别但不作为 display
  - "IAC一波"
  - "IAC双矿"
  - "Immortal Archon Chargelot"
  - "I AC"

enter_when:
  - "self.tech.warpgate.done"
  - "self.expansion_count >= 2"
  - "from_opening in [1g_robo_immortal, 4_gateway_pressure]"

# Phase stepper（2026-05-19 重写：纯 Chargelot+Archon 路线，DT 合 Archon）
phases:
  - id: economic_open
    display: "双矿 + BY"
    subtitle: "1:25 二矿 / 1:35 控制核心 / 2:10 折跃研究"
    start_at_time: 0
  - id: tech_tree
    display: "VC + VD + BF"
    subtitle: "2:38 议会 / 3:14 黑暗神殿 / 3:00 锻炉 → Charge + DT + +1/+1"
    start_at_time: 158    # ~2:38
  - id: dt_pool
    display: "8 DT 进 Archon 池"
    subtitle: "4:38 第一批 DT × 4 / 5:26 第二批 DT × 4，全部合白球"
    start_at_time: 278    # ~4:38
  - id: gateway_mass
    display: "6 BG 暴叉子 + 升攻防"
    subtitle: "4:00-5:00 6 BG 暴 chargelot，Forge +1 攻 + +1 防研究中"
    start_at_time: 240    # ~4:00
  - id: archon_form
    display: "Archon 合体"
    subtitle: "5:30+ Archon 由 DT 配对合，2 DT → 1 Archon，最终 4-6 Archon"
    start_at_time: 330    # ~5:30
  - id: attack_timing
    display: "7:30 一攻一防完出门"
    subtitle: "Charge + +1 攻 + +1 防 + 4 Archon + 12+ Chargelot → 主力 attack"
    start_at_time: 450    # ~7:30

# 数据来源:https://lotv.spawningtool.com/build/196674/ (2 Base PvX IAC all-in)
# 关键 build 节点:
# - 1:25 Natural (2nd Base)
# - 1:35 Cybernetics Core
# - 2:10 Warpgate research
# - 2:22 Robotics Facility
# - 3:25 / 4:05 Immortal x2
# - 3:40 Twilight Council
# - 4:27 Charge research
# - 4:35 / 4:56 Gateway 暴兵 (7 BG 总数)
# - 5:01 Templar Archives
# - 6:15 出门 attack(Charge 完 + +1 武器中)
# 2026-05-19 重写：纯 Chargelot + Archon 路线，DT 合 Archon
# target_composition / required_* 用 sc2 SDK 名（PascalCase），跟 unit_data 查表对齐
commitments:
  units:
    Zealot: 24        # 主力 charge zealot（target 24，叉球一波主体）
    Archon: 4         # ★ DT 合，2 DT → 1 Archon，8 DT → 4 Archon
    DarkTemplar: 8    # transient（全部合 archon，最终 army 不含 DT）
    Stalker: 2        # 火力侦查 + 早期防身
    Sentry: 2         # 力场切阵
  tech: [WarpGateResearch, Charge, ProtossGroundWeaponsLevel1, ProtossGroundArmorsLevel1]
  structures:
    Gateway: 6        # 不需要 7 BG（没不朽吃 gas，mineral 6 BG 够暴叉子）
    TwilightCouncil: 1
    DarkShrine: 1     # ★ DT 必备，取代 Robo
    Forge: 1
    # 不需要 Robo（不出不朽 / observer）
  expansions: 2

# 一波 timing(spawning tool 6:15 出门;留窗口到 7:30 接 follow-up)
attack_window:
  open_at: "6:15"
  close_at: "7:30"
  target_priority: [army, natural, production]

micro_doctrine:
  - "charge zealot 主力前压,接战时 charge 切入对方后排"
  - "archon focus_fire bio_clumps / 远程单位"
  - "immortal target high_hp_armored (Stalker / Roach / Marauder)"
  - "if has_sentry_energy: forcefield split_enemy_army"
  - "warp prism 1-2 个增援 / pickup low_hp 单位"

# 仅用于 PWA 显示与 LLM 上下文，真实 build 由 IacTwoBase.create_plan 控制
steps:
  - "13 build BE"
  - "13 build BG"
  - "14 build BA"
  - "16 build BN"
  - "16 build BY"
  - "18 build BA"
  - "20 research 折跃 @chrono"
  - "22 build VC"
  - "22 build BF"
  - "24 research 冲锋 @chrono"
  - "24 build VD"
  - "28 research 地面攻击1 @BF"
  - "28 research 地面防御1 @BF"
  - "30 train DT @chrono"
  - "38 train 叉子"
  - "48 build BG"

expire_action:
  - "transition: persistent_skytoss"

lategame_transitions:
  - lategame_id: persistent_skytoss
    when: "default"
  - lategame_id: persistent_skytoss
    when: "enemy.lategame_composition"
