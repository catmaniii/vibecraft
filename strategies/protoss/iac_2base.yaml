kind: midgame_stance
id: iac_2base
display_name_zh: "叉球一波"
summary_zh: "vanilla IAC：双矿冲锋叉+不朽一波 timing,6:30 出门 all-in。核心 chargelot 主力 + 3 不朽针对装甲 + 7 BG 暴兵。不出 archon（要 archon 走 dt_drop_iac）"
sharpy_dummy_class: "vibecraft.bot.auto_combat.protoss.plans.iac_2base:IacTwoBase"
aliases:
  - "叉球一波"
  - "叉球"
  - "叉光"
  - "叉光不朽推"
  - "叉球不朽推"
  - "白球冲锋叉一波"
  - "不朽光灵冲锋叉"
  - "重装地面"
  - "双矿叉球"
  - "双矿一波"
  - "IAC"             # 老外文术语别名，仍接受识别但不作为 display
  - "IAC一波"
  - "IAC双矿"
  - "Immortal Archon Chargelot"
  - "I AC"

enter_when:
  - "self.tech.warpgate.done"
  - "self.expansion_count >= 2"
  - "from_opening in [1g_robo_immortal, 4_gateway_pressure]"

# 数据来源:https://lotv.spawningtool.com/build/196674/ (2 Base PvX IAC all-in)
# 关键 build 节点:
# - 1:25 Natural (2nd Base)
# - 1:35 Cybernetics Core
# - 2:10 Warpgate research
# - 2:22 Robotics Facility
# - 3:25 / 4:05 Immortal x2
# - 3:40 Twilight Council
# - 4:27 Charge research
# - 4:35 / 4:56 Gateway 暴兵 (7 BG 总数)
# - 5:01 Templar Archives
# - 6:15 出门 attack(Charge 完 + +1 武器中)
commitments:
  units:
    zealot: 16        # 主力(charge zealot)
    immortal: 3       # 针对装甲(spawning tool 至少 2)
    # archon 移除：vanilla IAC 2-base 6:15 timing 来不及上 VA+TA+HT，不出 archon。
    # 想要"DT 合 archon 转 IAC"的变体 → 切剧本 `dt_drop_iac`（空投隐刀转叉球一波）
    stalker: 4        # 防空 / 增援
    sentry: 2         # 力场切阵
  tech: [WarpGateResearch, Charge, ProtossGroundWeapons]
  structures:
    gateway: 7        # spawning tool 4:35+4:56 暴 7 BG
    robo: 1
    twilight: 1
    forge: 1
  expansions: 2

# 一波 timing(spawning tool 6:15 出门;留窗口到 7:30 接 follow-up)
attack_window:
  open_at: "6:15"
  close_at: "7:30"
  target_priority: [army, natural, production]

micro_doctrine:
  - "charge zealot 主力前压,接战时 charge 切入对方后排"
  - "archon focus_fire bio_clumps / 远程单位"
  - "immortal target high_hp_armored (Stalker / Roach / Marauder)"
  - "if has_sentry_energy: forcefield split_enemy_army"
  - "warp prism 1-2 个增援 / pickup low_hp 单位"

expire_action:
  - "transition: skytoss"

lategame_transitions:
  - lategame_id: skytoss
    when: "default"
  - lategame_id: skytoss
    when: "enemy.lategame_composition"
