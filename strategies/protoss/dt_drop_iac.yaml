kind: midgame_stance
id: dt_drop_iac
display_name_zh: "空投隐刀转叉球一波"
summary_zh: "Stats 经典：3:14 VD 起 DT 骚扰，残 DT 合 Archon，5:38 Charge+1 攻，6:11 暴 4 BG，~8:00 不朽+Archon+叉子大军一波"
sharpy_dummy_class: "vibecraft.bot.auto_combat.protoss.plans.dt_drop_iac:DtDropIac"
aliases:
  - "空投隐刀转叉球一波"
  - "空投隐刀转叉球"
  - "暗使转叉球"
  - "暗使转白球"
  - "影刀转白球"
  - "影刀合白球"
  - "DT合白球IAC"
  - "DT合白球转叉球"
  - "DT转Archon"
  - "Stats DT IAC"
  - "Stats dt iac"
  - "Stats叉球"
  - "DT骚扰转叉球一波"
  - "暗使白球IAC"
  - "DT空投转IAC"

enter_when:
  - "self.tech.warpgate.done"
  - "self.expansion_count >= 2"

# 数据来源:https://lotv.spawningtool.com/build/68902/ (Stats' Double DT/Archon drop into IAC push)
# 关键 build 节点（Stats 韩国职业 PvP/PvT 通用变体）:
# - 2:38 Twilight Council  (supply 31)
# - 3:05 Robotics Facility (supply 34)
# - 3:14 Dark Shrine       (supply 36) ★ DT 前置
# - 4:38 Dark Templar ×4   (supply 51) ★ 首波 DT 骚扰
# - 4:40 4 DT 跑至 3/4 地图,骚扰对方矿线
# - 5:26 Dark Templar ×4   (supply 60) ★ 第二批 DT
# - 5:29 Archon ×2         (supply 68) ★ 残 DT 合 Archon
# - 5:38 Forge + Charge research (supply 68)
# - 6:04 Gateway ×3        (supply 76)
# - 6:11 Gateway ×4 (共4)  (supply 76)
# - ~8:00 出门 attack: 3-4 Immortal + 6 Archon + Sentry + 满 Zealot
commitments:
  units:
    zealot: 14        # Charge 叉主力(IAC 主体)
    immortal: 4       # 反装甲核心
    archon: 6         # ★ DT 合,2:1 → 4 DT 合 2 archon,8 DT 合 4 archon,后续补到 6
    dark_templar: 8   # 总 DT 产量(2 批 ×4),骚扰 + 合 archon 池子
    stalker: 2        # 早期防身
    sentry: 2         # 力场切阵
  tech: [WarpGateResearch, Charge, ProtossGroundWeapons]
  structures:
    gateway: 4        # Stats 主线 4 BG（archon 顶伤害,不暴 7 BG）
    robo: 1
    twilight: 1
    dark_shrine: 1    # ★ DT 必备
    forge: 1
  expansions: 2

# 一波 timing(Stats spawningtool ~8:00 出门;留窗口到 9:30 接 follow-up)
attack_window:
  open_at: "8:00"
  close_at: "9:30"
  target_priority: [army, natural, production]

micro_doctrine:
  - "DT 首波 ~4:40 到对方家,骚扰 worker / supply / tech building"
  - "保 DT 别死 → 残 DT 回家合 Archon(2 DT 合 1)"
  - "Archon 切前排 / 集火 bio_clumps + 远程"
  - "Immortal target high_hp_armored (Stalker / Roach / Marauder)"
  - "Charge 叉主力前压,接战时 charge 切入对方后排"
  - "if has_sentry_energy: forcefield split_enemy_army"

expire_action:
  - "transition: skytoss"

lategame_transitions:
  - lategame_id: skytoss
    when: "default"
