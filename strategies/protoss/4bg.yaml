kind: opening_build
id: 4bg
display_name_zh: "4 门 BG 早压"
summary_zh: "经典 4 BG 折跃压制(无闪烁):单 BG → BC → 升折跃,补 3 BG,折跃完成 + 探机前线修 PY+BG → 出门压制 + 火力侦察"
sharpy_dummy_class: "voicecraft.bot.auto_combat.protoss.plans.gate4_pressure:Gate4Pressure"
aliases:
  - "4BG"
  - "4bg"
  - "四门"
  - "4门"
  - "4 Gate"
  - "4Gate"
  - "4G"
  - "4门追猎"
  - "4 Gate Stalker"
  - "4门压制"
  - "4 Gateway"
  - "四门压制"
  - "纯狂"
  - "纯狂热者"
matchup: [PvT, PvZ, PvP]

phases:
  - id: opening
    display: "单 BG"
    subtitle: "13 农 → BG + 1 气"
    start_at_supply: 13
  - id: tech
    display: "BC + 持续 chrono 折跃"
    subtitle: "BC 一好就停农 chrono,所有能量给折跃"
    start_at_supply: 18
  - id: massing
    display: "补 3 BG"
    subtitle: "折跃过半 + 矿 ≥ 450 → 一次性下 3 BG"
    start_at_supply: 24
  - id: forward
    display: "探机前线修 PY+BG"
    subtitle: "3 BG 开始造 → 派 1 农民到前线安全位置修 PY+BG,方便折跃刷兵"
    start_at_supply: 28
  - id: pressuring
    display: "首波出门压制"
    subtitle: "4 追猎集齐 → 出门 + 火力侦察"
    start_at_supply: 32
    start_at_time: 300

# 仅用于 PWA 显示与 LLM 上下文,真实 build 由 Gate4Pressure.create_plan 控制
steps:
  - "9 build PY"
  - "13 build BG"
  - "15 build VC"
  - "16 build BC"
  - "17 build PY"
  - "19 train 追猎"
  - "20 build VC"
  - "21 research 折跃 @chrono"
  - "24 build BG"
  - "24 build BG"
  - "24 build BG"
  - "25 build PY"
  - "26 train 追猎"
  - "30 train 追猎"
  - "34 train 追猎"

scout_at: "13 send_probe enemy_natural"

abort_signals:
  - sees: "enemy.units.phoenix.count >= 2"
    then: "transition:1g_stargate"
  - sees: "enemy.units.colossus.count >= 1"
    then: "transition:iac_2base"

# 4 Gate 压制后续视战况:打崩则继续追加 BG / 暴兵,打不动则开矿转 iac_2base
default_transitions:
  - midgame_id: iac_2base
    when: "default"
