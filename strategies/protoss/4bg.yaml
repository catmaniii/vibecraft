kind: opening_build
id: 4bg
display_name_zh: "4 门 BG 早压"
summary_zh: "经典 4 BG 折跃压制(无闪烁):单 BG → BY → 升折跃,家里补到 3 BG + 前线 1 野 BG（总 4 BG）,折跃完成 + 探机前线修 BE+BG → 出门压制 + 火力侦察"
sharpy_dummy_class: "vibecraft.bot.auto_combat.protoss.plans.gate4_pressure:Gate4Pressure"
aliases:
  - "4BG"
  - "4bg"
  - "四门"
  - "4门"
  - "4 Gate"
  - "4Gate"
  - "4G"
  - "4门追猎"
  - "4 Gate Stalker"
  - "4门压制"
  - "4 Gateway"
  - "四门压制"
  - "纯狂"
  - "纯狂热者"
matchup: [PvT, PvZ, PvP]

phases:
  - id: opening
    display: "单 BG"
    subtitle: "13 农 → BG + 1 气"
    start_at_supply: 13
  - id: tech
    display: "BY + 全力 chrono 折跃"
    subtitle: "不 chrono 探机；BY 一好所有 chrono 全给折跃研究；同时只出 1 追猎探路/防守"
    start_at_supply: 18
  - id: massing
    display: "家里补到 3 BG"
    subtitle: "折跃过半 + 矿 ≥ 300 → 一次性下 2 BG（家 1 → 3）"
    start_at_supply: 24
  - id: forward
    display: "前线野 BE + 野 BG"
    subtitle: "家里 BG 在造的同时 → 派 1 农民到前线修 BE + 1 BG（总 4 BG）"
    start_at_supply: 28
  - id: pressuring
    display: "前线集中刷兵 + 首波压制"
    subtitle: "折跃完成 + 4 BG 全 ready → 所有 wg 都在前线 warp，集结即出门"
    start_at_supply: 32
    start_at_time: 300

# 仅用于 PWA 显示与 LLM 上下文,真实 build 由 Gate4Pressure.create_plan 控制
steps:
  - "9 build BE"
  - "13 build BG"
  - "15 build VC"
  - "16 build BY"
  - "17 build BE"
  - "19 train 追猎"
  - "20 build VC"
  - "21 research 折跃 @chrono"
  - "24 build BG"
  - "24 build BG"
  - "25 build BE"
  - "26 train 追猎"
  - "30 train 追猎"
  - "34 train 追猎"

scout_at: "13 send_probe enemy_natural"

abort_signals:
  - sees: "enemy.units.phoenix.count >= 2"
    then: "transition:1g_stargate"
  - sees: "enemy.units.colossus.count >= 1"
    then: "transition:iac_2base"

# 4 Gate 压制后续视战况:打崩则继续追加 BG / 暴兵,打不动则开矿转 iac_2base
default_transitions:
  - midgame_id: iac_2base
    when: "default"
