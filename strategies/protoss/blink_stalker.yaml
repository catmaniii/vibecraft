kind: opening_build
id: blink_stalker
display_name_zh: "闪追压制"
summary_zh: "4 门闪烁追猎压制（Blink Stalker timing）：双矿 + 4 BG + 研闪烁 + Warp Prism，5:07 左右出门。PvT/PvP 中期主线"
sharpy_dummy_class: "vibecraft.bot.auto_combat.protoss.plans.blink_stalker:BlinkStalker"
aliases:
  - "闪追"
  - "闪追压制"
  - "闪烁追猎"
  - "4门闪追"
  - "blink stalker"
  - "Blink Stalker"
  - "blink压制"
  - "闪追timing"
  - "闪烁timing"
  - "blink timing"
  - "4 Gate Blink"
  - "4gate blink"
  - "Parting blink"
  - "PartinG blink"
  - "闪现"
  - "stalker blink"
matchup: [PvT, PvP]

phases:
  - id: opening
    display: "单 BG"
    subtitle: "13 农 → BG + 1 气"
    start_at_supply: 13
  - id: tech
    display: "BY + 折跃 chrono"
    subtitle: "BG ready 上 BY，折跃 chrono"
    start_at_supply: 19
  - id: twilight
    display: "VT + 研闪烁"
    subtitle: "VT 一好立刻研闪烁，期间双矿铺开"
    start_at_supply: 28
  - id: massing
    display: "暴 4 BG"
    subtitle: "折跃过半补到 4 BG + Warp Prism"
    start_at_supply: 38
  - id: pressuring
    display: "5:07 出门闪追压制"
    subtitle: "11 stalker + 1 adept + WP，闪烁 timing 出门"
    start_at_supply: 68
    start_at_time: 307

# 数据来源：lotv.spawningtool.com/build/178931/ (Harstem's Guide to Parting 4 Gate Blink PvT)
steps:
  - "14 build BE"
  - "15 build BG"
  - "16 build BA"
  - "20 build BN"
  - "20 build BY"
  - "21 build BA"
  - "21 train 追猎 @chrono"
  - "22 research 折跃 @chrono"
  - "28 build VT"
  - "34 build VR"
  - "37 research 闪烁 @chrono"
  - "38 build BG"
  - "38 build BG"
  - "40 build BG"
  - "40 train OB"
  - "46 train WP @chrono"
  - "55 build BA"
  - "72 build BN"

scout_at: "13 send_probe enemy_natural"

abort_signals:
  - sees: "enemy.units.colossus.count >= 1"
    then: "transition:iac_2base"
  - sees: "enemy.units.disruptor.count >= 1"
    then: "transition:iac_2base"

# 闪追压制后续：打崩则继续追加 stalker / 暴兵，打不动则开矿转 iac_2base 或 skytoss
default_transitions:
  - midgame_id: iac_2base
    when: "default"
