# 神族中央别名表（设计文档 §4.4）
#
# 三组：buildings / units / upgrades
# 每条 entry：
#   canonical:                  # 内部统一 id（与 SC2 单位 type name 对齐）
#     default_display: ""       # 玩家手机驾驶舱默认显示
#     aliases: [...]            # 接受的玩家用法（中文 / hotkey / 英文短称）
#     hotkey: "B+G"             # 仅信息，不参与匹配
#
# 注意：verb 消歧用来区分"造建筑 / 出单位 / 研升级"（玩家说的动词决定查哪组）。

buildings:
  Nexus:
    default_display: "NX"
    aliases: [NX, 基地, 主基地, Nexus]
    hotkey: "B+N"
